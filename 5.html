<!DOCTYPE html>
<html>
<head>
<style>


.navbar {
  background: linear-gradient(to right, #003b5c, #00a6a6, #a8d400);
  padding: 20px;
}



.dropdown {
  position: relative;
  display: inline-block;
}

.dropbtn {
  background: #2f5f7a;
  color: white;
  padding: 12px 20px;
  font-size: 20px;
  border: none;
  border-radius: 8px;
  margin-left:40px;
  cursor: pointer;
}

.dropdown-content {
  display: none;
  position: absolute;
  background: white;
  min-width: 250px;
  box-shadow: 0px 4px 10px rgba(0,0,0,0.2);
  padding: 15px;
}


.dropdown-content a {
  display: block;
  color: #00334d;
  padding: 10px;
  text-decoration: none;
  font-size: 18px;
}


.dropdown-content a:hover {
  background: #f2f2f2;
}


.dropdown:hover .dropdown-content {
  display: block;
}



.hero{
  height:400px;

  background: linear-gradient(to right, #004d66, #00a6a6, #8ccf2f);

  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
}


.hero h1{
  color:white;
  font-size:70px;
  margin-bottom:40px;
}

.search-box{
  width:800px;
  background:white;

  display:flex;
  justify-content:space-between;
  align-items:center;

  padding:20px;

  border-radius:10px;

  box-shadow:0px 5px 10px rgba(0,0,0,0.3);
}


.search-box input{
  width:100%;
  border:none;
  outline:none;
  font-size:28px;
}


.icon{
  font-size:35px;
  color:#00a6a6;
}

table, th, td {
  border:1px solid black;
  border-collapse: collapse;
  padding: 10px;
}


</style>
</head>
<body>
