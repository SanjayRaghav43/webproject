<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Website</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
    background:#f4f4f4;
}

/* Navbar */
.navbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:#333;
    color:white;
    padding:20px;
}

.navbar ul{
    display:flex;
    list-style:none;
    gap:20px;
}

.navbar a{
    color:white;
    text-decoration:none;
}

/* Hero Section */
.hero{
    height:50vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    background:lightblue;
    border-bottom:4px solid #333;
}

.hero h1{
    font-size:3rem;
    margin-bottom:10px;
}

.hero p{
    margin-bottom:20px;
}

.hero button{
    padding:10px 20px;
    border:2px solid #333;
    border-radius:5px;
    cursor:pointer;
}

/* Cards Section */
.cards{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:20px;
    padding:40px;
}

.card{
    background:white;
    border:2px solid #333;
    border-radius:10px;
    padding:20px;
    text-align:center;
    box-shadow:0 4px 10px rgba(0,0,0,0.2);
}

.card h2{
    margin-bottom:10px;
}

.card p{
    margin-bottom:15px;
}

.card button{
    padding:10px 15px;
    border:none;
    background:#333;
    color:white;
    border-radius:5px;
    cursor:pointer;
}

/* Footer */
footer{
    text-align:center;
    background:#333;
    color:white;
    padding:20px;
}

</style>
</head>
<body>

<nav class="navbar">
    <h2>My Website</h2>

    <ul>
        <li><a href="#">Home</a></li>
        <li><a href="#">About</a></li>
        <li><a href="#">Services</a></li>
        <li><a href="#">Contact</a></li>
    </ul>
</nav>

<section class="hero">
    <h1>Welcome to My Website</h1>
    <p>Learn HTML and CSS by building projects.</p>
    <button>Get Started</button>
</section>

<section class="cards">

    <div class="card">
        <h2>HTML</h2>
        <p>Learn the structure of web pages.</p>
        <button>Read More</button>
    </div>

    <div class="card">
        <h2>CSS</h2>
        <p>Style your website with modern layouts.</p>
        <button>Read More</button>
    </div>

    <div class="card">
        <h2>JavaScript</h2>
        <p>Add interactivity to your website.</p>
        <button>Read More</button>
    </div>

</section>

<footer>
    <p>&copy; 2026 My Website. All Rights Reserved.</p>
</footer>

</body>
</html>
